<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Spec §6.3: declares support for both colour schemes so native scrollbars,
      form controls and the browser's own UA styles follow the active theme.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>Slydr</title>

    <!--
      App icons live in client/public, which Vite copies verbatim into
      client/dist, so every URL below is the same in development (Vite serves
      public/ at the origin root) and in production (Express serves client/dist
      from the same origin). Same-origin images are allowed by the §3.4 CSP
      (`default-src 'self'; img-src 'self' blob: data:`), so no attribute here
      needs a hash, nonce or exception. Do not point these at another origin.
      There is deliberately no manifest link: Slydr is loopback-only and is not
      an installable PWA, so `client/public/site.webmanifest` is never linked
      from this document.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Anti-FOUC theme initialiser (spec §6.3).
      Parser-blocking classic script, so data-theme is set BEFORE first paint.
      It is a separate same-origin file, not an inline script, because the
      document is served with `script-src 'self'` (spec §3.4). Do not add
      `defer`, `async` or `type="module"` — each of them defers execution past
      first paint and reintroduces the theme flash. Do not inline it.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
